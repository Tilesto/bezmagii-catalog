<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 480">
  <!-- Версия для роликов: крупный кот выглядывает из-за ноутбука, прозрачный фон, белая обводка стикера.
       Ставится поверх записи экрана (угол) или крупно на CTA-экран. Основа — стиль 1. -->
  <defs>
    <filter id="v-st" x="-10%" y="-10%" width="120%" height="120%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="9" result="d"/>
      <feGaussianBlur in="d" stdDeviation="6" result="b"/>
      <feOffset in="b" dy="8" result="o"/>
      <feFlood flood-color="#000" flood-opacity=".3"/>
      <feComposite in2="o" operator="in" result="sh"/>
      <feFlood flood-color="#fff"/>
      <feComposite in2="d" operator="in" result="w"/>
      <feMerge><feMergeNode in="sh"/><feMergeNode in="w"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#v-st)" stroke="#1B1B1F" stroke-linejoin="round" stroke-linecap="round">
    <!-- кот, масштаб 2× от аватарки -->
    <g transform="translate(20 0) scale(2)" stroke-width="3">
      <path d="M26 206 C30 168 60 152 100 152 C140 152 170 168 174 206 Z" fill="#F2A65A"/>
      <ellipse cx="100" cy="128" rx="58" ry="47" fill="#F2A65A"/>
      <path d="M88 90 L90 100 M100 88 L100 100 M112 90 L110 100" stroke="#D9822B" stroke-width="3"/>
      <ellipse cx="100" cy="152" rx="25" ry="16" fill="#FBE3C4" stroke="none"/>
      <path d="M66 128 A11 11 0 0 0 88 128 Z" fill="#1B1B1F" stroke-width="2.5"/>
      <path d="M112 128 A11 11 0 0 0 134 128 Z" fill="#1B1B1F" stroke-width="2.5"/>
      <circle cx="80" cy="132" r="2.5" fill="#fff" stroke="none"/>
      <circle cx="126" cy="132" r="2.5" fill="#fff" stroke="none"/>
      <path d="M94 144 L106 144 L100 151 Z" fill="#E88A8A" stroke-width="1.5"/>
      <path d="M92 158 L108 158" fill="none" stroke-width="2"/>
      <path d="M70 148 L48 144 M70 154 L49 157 M130 148 L152 144 M130 154 L151 157" stroke-width="1.5"/>
      <path d="M46 98 C66 74 82 44 100 8 C116 44 132 74 154 98 Z" fill="#4B3B7A"/>
      <path d="M100 44 L104.7 54.5 L116 55.7 L107.5 63.3 L109.9 74.5 L100 68.8 L90.1 74.5 L92.5 63.3 L84 55.7 L95.3 54.5 Z" fill="#FFD25A" stroke-width="2"/>
      <circle cx="100" cy="61" r="20" fill="none" stroke="#E5484D" stroke-width="4.5"/>
      <path d="M86 47 L114 75" stroke="#E5484D" stroke-width="4.5"/>
      <ellipse cx="100" cy="100" rx="74" ry="16" fill="#3A2D60"/>
    </g>
    <!-- крышка ноутбука (вид сзади) -->
    <rect x="34" y="336" width="372" height="132" rx="14" fill="#2B2D33" stroke-width="6"/>
    <path d="M50 352 L390 352" stroke="#3B3E46" stroke-width="4"/>
    <!-- наклейка на крышке: тот же знак -->
    <circle cx="220" cy="410" r="30" fill="#FFF7E0" stroke-width="4"/>
    <!-- звезда с кольцом по центру наклейки (круг cy=410) -->
    <g transform="translate(0 4)">
    <path d="M220 391 L224.2 400.4 L234.4 401.5 L226.8 408.4 L228.9 418.5 L220 413.4 L211.1 418.5 L213.2 408.4 L205.6 401.5 L215.8 400.4 Z" fill="#FFD25A" stroke-width="2.5"/>
    <circle cx="220" cy="406" r="20" fill="none" stroke="#E5484D" stroke-width="5"/>
    <path d="M206 392 L234 420" stroke="#E5484D" stroke-width="5"/>
    </g>
    <!-- лапы на крышке -->
    <ellipse cx="146" cy="338" rx="34" ry="20" fill="#F7BE80" stroke-width="6"/>
    <ellipse cx="294" cy="338" rx="34" ry="20" fill="#F7BE80" stroke-width="6"/>
    <path d="M134 330 L134 344 M146 328 L146 345 M158 330 L158 344 M282 330 L282 344 M294 328 L294 345 M306 330 L306 344" stroke-width="3"/>
  </g>
</svg>
